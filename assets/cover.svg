<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Financial Empire cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0c12"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 90) scale(620)">
      <stop offset="0" stop-color="#d4af52" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4af52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 720) scale(640)">
      <stop offset="0" stop-color="#4ea3ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ea3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="120" y1="300" x2="120" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbe7ad"/>
      <stop offset="1" stop-color="#cda84e"/>
    </linearGradient>
    <linearGradient id="badge" x1="100" y1="250" x2="280" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbe7ad"/>
      <stop offset="0.45" stop-color="#e7c873"/>
      <stop offset="0.75" stop-color="#cda84e"/>
      <stop offset="1" stop-color="#8a6a18"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="380" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25d07d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#25d07d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowGold)"/>
  <rect width="1280" height="720" fill="url(#glowBlue)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 180 H1280 M0 360 H1280 M0 540 H1280"/>
    <path d="M256 0 V720 M512 0 V720 M768 0 V720 M1024 0 V720"/>
  </g>

  <!-- market area chart -->
  <path d="M0 560 L120 540 L240 580 L360 470 L480 510 L600 410 L720 450 L840 330 L960 360 L1080 250 L1200 300 L1280 220 L1280 720 L0 720 Z" fill="url(#area)"/>
  <path d="M0 560 L120 540 L240 580 L360 470 L480 510 L600 410 L720 450 L840 330 L960 360 L1080 250 L1200 300 L1280 220" fill="none" stroke="#25d07d" stroke-width="3" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- candlesticks -->
  <g stroke-width="3">
    <g stroke="#25d07d"><path d="M205 470 V520"/><rect x="200" y="482" width="10" height="26" fill="#25d07d"/></g>
    <g stroke="#ff4d67"><path d="M455 430 V485"/><rect x="450" y="444" width="10" height="28" fill="#ff4d67"/></g>
    <g stroke="#25d07d"><path d="M905 300 V356"/><rect x="900" y="312" width="10" height="32" fill="#25d07d"/></g>
    <g stroke="#25d07d"><path d="M1145 232 V292"/><rect x="1140" y="244" width="10" height="34" fill="#25d07d"/></g>
  </g>

  <!-- emblem badge -->
  <g transform="translate(120 250)">
    <rect x="0" y="0" width="180" height="180" rx="46" fill="url(#badge)"/>
    <rect x="2.5" y="2.5" width="175" height="175" rx="43.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <g fill="#1c1502" opacity="0.16">
      <rect x="40" y="112" width="17" height="32" rx="5"/>
      <rect x="66" y="95" width="17" height="49" rx="5"/>
      <rect x="92" y="78" width="17" height="66" rx="5"/>
      <rect x="118" y="58" width="17" height="86" rx="5"/>
    </g>
    <path d="M40 122 L71 94 L94 110 L138 60" fill="none" stroke="#1c1502" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M138 60 L114 62.5 M138 60 L135.5 84" fill="none" stroke="#1c1502" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="94" r="7" fill="#fff" fill-opacity="0.92"/>
  </g>

  <!-- wordmark -->
  <text x="338" y="318" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-1" fill="url(#goldText)">FINANCIAL</text>
  <text x="338" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="6" fill="#eef1f6">EMPIRE</text>
  <text x="342" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="#8a93a3">From $10,000 to a global financial empire</text>

  <!-- feature pills -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">
    <g transform="translate(342 498)">
      <rect width="232" height="48" rx="24" fill="#0d0f14" stroke="#2a313d"/>
      <text x="26" y="31" fill="#e7c873">📈 Live Markets</text>
    </g>
    <g transform="translate(590 498)">
      <rect width="210" height="48" rx="24" fill="#0d0f14" stroke="#2a313d"/>
      <text x="24" y="31" fill="#4ea3ff">🏦 Build Empires</text>
    </g>
    <g transform="translate(816 498)">
      <rect width="196" height="48" rx="24" fill="#0d0f14" stroke="#2a313d"/>
      <text x="24" y="31" fill="#25d07d">♻️ Prestige</text>
    </g>
  </g>
</svg>
